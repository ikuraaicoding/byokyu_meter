<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秒給メーター</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="秒給メーター">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-edge: #2c313a;
    --text: #e8eaed;
    --muted: #8b93a1;
    --led-on: #ff3b30;
    --led-off: #3a1614;
    --amber: #ffb020;
    --green: #35d07f;
    --accent: #ffb020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #232831 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .app { width: 100%; max-width: 640px; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; margin: 0 0 16px; letter-spacing: .08em; color: var(--text); font-weight: 700; }
  h1 img { border-radius: 9px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }

  /* ===== メーター本体 ===== */
  .meter {
    background: linear-gradient(180deg, #2a2e36, #191b20);
    border: 2px solid var(--panel-edge);
    border-radius: 18px;
    padding: 18px 18px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .lamps { display: flex; gap: 10px; margin-bottom: 14px; }
  .lamp {
    flex: 1; text-align: center; padding: 6px 0;
    border-radius: 8px; font-weight: 700; font-size: .95rem; letter-spacing: .3em;
    background: #101215; color: #3d434d; border: 1px solid #262a31;
    transition: all .2s;
  }
  .lamp.on-run  { color: #1a0d00; background: var(--amber); box-shadow: 0 0 16px rgba(255,176,32,.7); border-color: var(--amber); }
  .lamp.on-idle { color: #00200f; background: var(--green); box-shadow: 0 0 16px rgba(53,208,127,.6); border-color: var(--green); }

  .display {
    background: #0a0a0b;
    border-radius: 10px;
    border: 2px solid #000;
    box-shadow: inset 0 0 18px rgba(0,0,0,.9);
    padding: 16px 14px 12px;
  }
  .display-label { color: var(--muted); font-size: .72rem; letter-spacing: .15em; margin-bottom: 6px; }
  .digits { display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
  .digit { width: 11%; max-width: 54px; aspect-ratio: 60 / 100; }
  .digit svg { width: 100%; height: 100%; display: block; }
  .seg { fill: var(--led-off); transition: fill .05s; }
  .seg.on { fill: var(--led-on); filter: drop-shadow(0 0 4px rgba(255,59,48,.9)); }
  .sep { color: var(--led-on); font-weight: 900; font-size: 2.2rem; line-height: 1; padding-bottom: 2px; text-shadow: 0 0 8px rgba(255,59,48,.9); }
  .sep.dim { color: var(--led-off); text-shadow: none; }
  .yen { color: var(--led-on); font-size: 1.6rem; font-weight: 800; margin-right: 6px; padding-bottom: 6px; text-shadow: 0 0 8px rgba(255,59,48,.9); }
  .elapsed {
    margin-top: 10px; text-align: right;
    font-family: Consolas, "Courier New", monospace; font-size: 1.1rem; color: var(--amber);
    text-shadow: 0 0 6px rgba(255,176,32,.5);
  }

  .buttons { display: flex; gap: 10px; margin-top: 16px; }
  button {
    flex: 1; padding: 13px 8px; border-radius: 10px; border: 1px solid var(--panel-edge);
    font-size: 1rem; font-weight: 700; cursor: pointer; color: var(--text);
    background: #262a31; transition: transform .05s, filter .15s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--amber); color: #1a0d00; border-color: var(--amber); }
  button.primary.running { background: #ff6b5e; border-color: #ff6b5e; color: #2a0300; }
  button:focus-visible, input:focus-visible { outline: 2px solid #7db4ff; outline-offset: 2px; }

  /* ===== 内訳 ===== */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .stat .k { font-size: .7rem; color: var(--muted); letter-spacing: .1em; }
  .stat .v { font-size: 1.05rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat.hl .v { color: var(--amber); }

  /* ===== 設定 ===== */
  .settings { margin-top: 16px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px; padding: 16px; }
  .settings h2 { margin: 0 0 12px; font-size: .9rem; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
  .field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field label { font-size: .92rem; }
  .field .inp { display: flex; align-items: center; gap: 6px; }
  input[type=number] {
    width: 130px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: #12141a; color: var(--text); font-size: 1rem; text-align: right;
  }
  .unit { color: var(--muted); font-size: .85rem; min-width: 2.2em; }
  .note { font-size: .78rem; color: var(--muted); margin: 6px 0 0; line-height: 1.6; }
  .error { color: #ff8a80; font-size: .82rem; min-height: 1.2em; margin-top: 4px; }

  .modes { display: flex; gap: 6px; margin-bottom: 14px; background: #101215; padding: 4px; border-radius: 10px; }
  .modes button { padding: 8px 4px; font-size: .88rem; background: transparent; border: none; color: var(--muted); }
  .modes button.active { background: #2c313a; color: var(--text); }
  .status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .status-row .elapsed { margin-top: 0; }
  .badge { font-size: .8rem; font-weight: 700; color: var(--muted); min-height: 1.2em; }
  .badge.ot { color: #1a0d00; background: var(--amber); padding: 2px 10px; border-radius: 99px; box-shadow: 0 0 10px rgba(255,176,32,.5); }
  .hidden { display: none !important; }
  input[type=time] {
    width: 130px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: #12141a; color: var(--text); font-size: 1rem; color-scheme: dark;
  }
  .subhead { margin: 14px 0 8px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--panel-edge); padding-top: 12px; }

  @media (max-width: 480px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .digit { width: 10.5%; }
    .yen { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <h1><img src="logo.svg" alt="" width="36" height="36"><span>秒給メーター</span></h1>

  <section class="meter" aria-label="メーター">
    <div class="modes" role="group" aria-label="モード">
      <button id="modeManual" class="active">手動（ストップウォッチ）</button>
      <button id="modeClock">時計連動</button>
    </div>
    <div class="lamps">
      <div class="lamp" id="lampIdle">空車</div>
      <div class="lamp" id="lampRun">賃走</div>
    </div>
    <div class="display">
      <div class="display-label">稼いだ金額 / EARNED</div>
      <div class="digits" id="digits" role="img" aria-label="稼いだ金額"></div>
      <div class="status-row">
        <div class="badge" id="badge"></div>
        <div class="elapsed" id="elapsed" title="実働時間">00:00:00</div>
      </div>
    </div>
    <div class="buttons" id="manualButtons">
      <button class="primary" id="btnToggle">スタート</button>
      <button id="btnReset">リセット</button>
    </div>
  </section>

  <section class="stats" aria-label="給料の内訳">
    <div class="stat hl"><div class="k">秒給</div><div class="v" id="sSec">-</div></div>
    <div class="stat"><div class="k">分給</div><div class="v" id="sMin">-</div></div>
    <div class="stat"><div class="k">時給</div><div class="v" id="sHour">-</div></div>
    <div class="stat"><div class="k">日給</div><div class="v" id="sDay">-</div></div>
  </section>

  <section class="settings">
    <h2>設定</h2>
    <div class="field">
      <label for="income">月収（額面でも手取りでもOK）</label>
      <div class="inp"><input type="number" id="income" min="0" step="1000" inputmode="numeric"><span class="unit">円</span></div>
    </div>
    <div class="field">
      <label for="days">月の稼働日数</label>
      <div class="inp"><input type="number" id="days" min="1" max="31" step="1" inputmode="numeric"><span class="unit">日</span></div>
    </div>
    <div class="field">
      <label for="hours">1日の労働時間</label>
      <div class="inp"><input type="number" id="hours" min="0.1" max="24" step="0.25" inputmode="decimal"><span class="unit">時間</span></div>
    </div>
    <div class="field">
      <label for="mult">残業の割増率（所定時間を超えた分）</label>
      <div class="inp"><input type="number" id="mult" min="1" max="3" step="0.05" inputmode="decimal"><span class="unit">倍</span></div>
    </div>

    <div id="clockFields" class="hidden">
      <div class="subhead">時計連動の設定（今日の勤務）</div>
      <div class="field">
        <label for="tStart">出勤時刻</label>
        <div class="inp"><input type="time" id="tStart"></div>
      </div>
      <div class="field">
        <label for="tEnd">退勤時刻（空欄なら働き続ける）</label>
        <div class="inp"><input type="time" id="tEnd"></div>
      </div>
      <div class="field">
        <label for="tBs">休憩 開始</label>
        <div class="inp"><input type="time" id="tBs"></div>
      </div>
      <div class="field">
        <label for="tBe">休憩 終了</label>
        <div class="inp"><input type="time" id="tBe"></div>
      </div>
    </div>

    <div class="error" id="err" role="alert"></div>
    <p class="note">秒給 = 月収 ÷（稼働日数 × 労働時間 × 3600秒）。<br>
      実働が労働時間を超えた分は 秒給 × 割増率 で加算されます。休憩は実働に含みません。<br>
      設定はこのブラウザに保存されます（外部には送信しません）。</p>
  </section>
</main>

<script>
(() => {
  'use strict';

  // ---------- 7セグ表示の組み立て ----------
  const INT_DIGITS = 7;   // 整数部
  const DEC_DIGITS = 2;   // 小数部
  const SEGS = {          // a b c d e f g
    0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg',
    5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg'
  };
  const RECTS = {
    a: [10, 2, 40, 8], b: [50, 12, 8, 36], c: [50, 52, 8, 36], d: [10, 90, 40, 8],
    e: [2, 52, 8, 36], f: [2, 12, 8, 36], g: [10, 46, 40, 8]
  };
  const NS = 'http://www.w3.org/2000/svg';
  const digitsEl = document.getElementById('digits');
  const digitNodes = []; // {segs: {a: rect...}}

  function makeDigit() {
    const wrap = document.createElement('div');
    wrap.className = 'digit';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 60 100');
    const segs = {};
    for (const [k, [x, y, w, h]] of Object.entries(RECTS)) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', w); r.setAttribute('height', h);
      r.setAttribute('rx', 3);
      r.setAttribute('class', 'seg');
      svg.appendChild(r);
      segs[k] = r;
    }
    wrap.appendChild(svg);
    digitsEl.appendChild(wrap);
    return segs;
  }
  function makeText(cls, text) {
    const s = document.createElement('span');
    s.className = cls; s.textContent = text;
    digitsEl.appendChild(s);
    return s;
  }

  makeText('yen', '¥');
  const commaEls = [];
  for (let i = 0; i < INT_DIGITS; i++) {
    digitNodes.push(makeDigit());
    const remain = INT_DIGITS - 1 - i;
    if (remain > 0 && remain % 3 === 0) commaEls.push({ el: makeText('sep', ','), pos: i });
  }
  makeText('sep', '.');
  for (let i = 0; i < DEC_DIGITS; i++) digitNodes.push(makeDigit());

  const MAX_VALUE = Math.pow(10, INT_DIGITS) - 0.01;
  let lastText = '';

  function renderAmount(value) {
    const v = Math.min(Math.max(value, 0), MAX_VALUE);
    const cents = Math.floor(v * 100 + 1e-6);
    const text = String(cents).padStart(INT_DIGITS + DEC_DIGITS, '0');
    if (text === lastText) return;
    lastText = text;
    // 先頭の0は消灯（ただし1の位と小数部は常に点灯）
    const firstShown = Math.min(text.slice(0, INT_DIGITS).search(/[1-9]/) === -1 ? INT_DIGITS - 1 : text.search(/[1-9]/), INT_DIGITS - 1);
    digitNodes.forEach((segs, i) => {
      const ch = text[i];
      const visible = i >= firstShown;
      const on = visible ? SEGS[ch] : '';
      for (const k of Object.keys(segs)) segs[k].classList.toggle('on', on.includes(k));
    });
    commaEls.forEach(({ el, pos }) => el.classList.toggle('dim', pos < firstShown));
  }

  // ---------- 設定 ----------
  const $ = id => document.getElementById(id);
  const F = {
    income: $('income'), days: $('days'), hours: $('hours'), mult: $('mult'),
    start: $('tStart'), end: $('tEnd'), bs: $('tBs'), be: $('tBe')
  };
  const errEl = $('err');
  const STORE_KEY = 'byokyu-meter-v1';
  const DEFAULTS = {
    income: 300000, days: 20, hours: 8, mult: 1.25,
    mode: 'manual', start: '09:00', end: '', bs: '12:00', be: '13:00'
  };

  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === 'object') return { ...DEFAULTS, ...s };
    } catch (e) { /* 保存なしでも動く */ }
    return { ...DEFAULTS };
  }
  function saveSettings() {
    const s = {
      income: F.income.value, days: F.days.value, hours: F.hours.value, mult: F.mult.value,
      mode, start: F.start.value, end: F.end.value, bs: F.bs.value, be: F.be.value
    };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 無視 */ }
  }

  let mode = 'manual';
  const init = loadSettings();
  for (const k of Object.keys(F)) F[k].value = init[k];
  mode = init.mode === 'clock' ? 'clock' : 'manual';

  // ---------- 計算 ----------
  let perSec = 0;   // 通常の秒給
  let otSec = 0;    // 所定労働時間（秒）
  let mult = 1.25;
  let valid = false;
  const yen = (n, d = 0) => '¥' + n.toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d });

  // 実働秒数 → 稼いだ金額（所定時間を超えた分は割増）
  function earnedFor(w) {
    if (!valid) return 0;
    if (w <= otSec) return perSec * w;
    return perSec * otSec + perSec * mult * (w - otSec);
  }

  function parseHM(str) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(str || '');
    return m ? { h: +m[1], m: +m[2] } : null;
  }
  function todayAt(hm) {
    const d = new Date();
    d.setHours(hm.h, hm.m, 0, 0);
    return d.getTime();
  }

  function recalc() {
    const income = parseFloat(F.income.value);
    const days = parseFloat(F.days.value);
    const hours = parseFloat(F.hours.value);
    const m = parseFloat(F.mult.value);
    let msg = '';
    if (!(income >= 0) || !(days > 0) || !(hours > 0) || days > 31 || hours > 24) {
      msg = '数字をチェックしてね（日数: 1〜31 / 時間: 0より大きく24以下）';
    } else if (!(m >= 1) || m > 3) {
      msg = '割増率は1〜3倍で入れてね';
    } else if (mode === 'clock' && !parseHM(F.start.value)) {
      msg = '出勤時刻を入れてね';
    }
    errEl.textContent = msg;
    valid = !msg;
    if (!valid) return;
    mult = m;
    otSec = hours * 3600;
    const daySalary = income / days;
    const hourSalary = daySalary / hours;
    perSec = hourSalary / 3600;
    $('sSec').textContent = yen(perSec, 3);
    $('sMin').textContent = yen(perSec * 60, 1);
    $('sHour').textContent = yen(hourSalary, 0);
    $('sDay').textContent = yen(daySalary, 0);
  }

  // ---------- 実働の取得 ----------
  // 手動: ストップウォッチ。 時計連動: 現在時刻から毎回算出（リロードしても続きが見れる）
  let running = false;
  let elapsedMs = 0;
  let lastTick = 0;

  function manualWorked() {
    if (running) {
      const now = performance.now();
      elapsedMs += now - lastTick;
      lastTick = now;
    }
    return { w: elapsedMs / 1000, state: running ? 'work' : 'idle' };
  }

  function clockWorked() {
    const s = parseHM(F.start.value);
    if (!s) return { w: 0, state: 'idle' };
    const now = Date.now();
    const st = todayAt(s);
    const eHM = parseHM(F.end.value);
    const en = eHM ? todayAt(eHM) : Infinity;
    if (now < st) return { w: 0, state: 'before' };
    const t = Math.min(now, en);
    let w = Math.max(0, t - st);
    let inBreak = false;
    const bsHM = parseHM(F.bs.value), beHM = parseHM(F.be.value);
    if (bsHM && beHM) {
      const bs = todayAt(bsHM), be = todayAt(beHM);
      if (be > bs) {
        w -= Math.max(0, Math.min(t, be) - Math.max(st, bs));
        inBreak = now >= bs && now < be && now < en;
      }
    }
    const state = now >= en ? 'after' : (inBreak ? 'break' : 'work');
    return { w: Math.max(0, w) / 1000, state };
  }

  // ---------- 描画ループ ----------
  const lampRun = $('lampRun'), lampIdle = $('lampIdle'), btn = $('btnToggle');
  const badge = $('badge');
  let rafId = 0;

  function fmtTime(sec) {
    const t = Math.floor(sec);
    const h = String(Math.floor(t / 3600)).padStart(2, '0');
    const m = String(Math.floor(t % 3600 / 60)).padStart(2, '0');
    const s = String(t % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function frame() {
    const { w, state } = mode === 'clock' ? clockWorked() : manualWorked();
    renderAmount(earnedFor(w));
    $('elapsed').textContent = fmtTime(w);

    const working = state === 'work';
    lampRun.classList.toggle('on-run', working);
    lampIdle.classList.toggle('on-idle', !working);

    const overtime = valid && w > otSec && working;
    badge.classList.toggle('ot', overtime);
    if (overtime) badge.textContent = `残業中 ×${mult}`;
    else badge.textContent = ({ before: '出勤前', break: '休憩中', after: '退勤済み' })[state] || (w > otSec ? '残業分を含む' : '');

    rafId = 0;
    if (mode === 'clock' || running) rafId = requestAnimationFrame(frame);
  }
  function kick() {
    if (!rafId) rafId = requestAnimationFrame(frame);
  }

  // ---------- 操作 ----------
  function setRunning(on) {
    if (on && running === false) lastTick = performance.now();
    if (!on && running) manualWorked(); // 停止直前までを確定
    running = on;
    btn.classList.toggle('running', on);
    btn.textContent = on ? 'ストップ' : (elapsedMs > 0 ? '再開' : 'スタート');
    kick();
    if (!on) { cancelAnimationFrame(rafId); rafId = 0; frame(); }
  }

  btn.addEventListener('click', () => {
    if (!valid && !running) return;
    setRunning(!running);
  });
  $('btnReset').addEventListener('click', () => {
    running = false; elapsedMs = 0;
    cancelAnimationFrame(rafId); rafId = 0;
    setRunning(false);
    btn.textContent = 'スタート';
  });

  function setMode(m) {
    if (m === 'clock' && running) setRunning(false);
    mode = m;
    $('modeManual').classList.toggle('active', m === 'manual');
    $('modeClock').classList.toggle('active', m === 'clock');
    $('manualButtons').classList.toggle('hidden', m === 'clock');
    $('clockFields').classList.toggle('hidden', m === 'manual');
    recalc();
    saveSettings();
    cancelAnimationFrame(rafId); rafId = 0;
    lastText = '';
    frame();
  }
  $('modeManual').addEventListener('click', () => setMode('manual'));
  $('modeClock').addEventListener('click', () => setMode('clock'));

  // 設定を変えたら、実働分すべてを新しい条件で再計算する
  Object.values(F).forEach(el => el.addEventListener('input', () => {
    recalc(); saveSettings(); lastText = ''; frame();
  }));

  document.addEventListener('visibilitychange', () => { if (!document.hidden) { cancelAnimationFrame(rafId); rafId = 0; frame(); } });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && mode === 'manual' && !['INPUT', 'BUTTON'].includes(e.target.tagName)) {
      e.preventDefault(); btn.click();
    }
  });

  setMode(mode);
  if (mode === 'manual') btn.textContent = 'スタート';
})();

// PWA: Service Worker 登録（http/https のときだけ。ファイルを直接開いた場合は何もしない）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 失敗しても通常どおり動く */ });
  });
}
</script>
</body>
</html>
